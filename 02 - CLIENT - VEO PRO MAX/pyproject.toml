[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veo-pro-max"
version = "2.1.0"
description = "VEO Pro Max - AI Video Generation Tool"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "VEO Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "customtkinter>=5.2.0",
    "Pillow>=10.0.0",
    "playwright>=1.40.0",
    "requests>=2.31.0",
    "pycryptodome>=3.19.0",
    "firebase-admin>=6.2.0",
    "aiohttp>=3.9.0",
    "ntplib>=0.4.0",
    "tenacity>=8.2.0",
]

[project.scripts]
veo-pro-max = "main:main"

[project.gui-scripts]
veo-pro-max-gui = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "core*", "ui*", "services*", "utils*"]
